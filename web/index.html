<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3c2415" />
    <meta name="description" content="A register of four-minute phonograph cylinders for the Edison Amberola: the master catalog, and the collection." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>The Amberola Cylinder Register</title>
    <script>
      // Applies the stored daylight/lamplight choice before the first paint,
      // so the page never opens in the wrong theme and correct itself. With
      // no stored choice the system preference is left to tokens.css.
      (function () {
        try {
          var t = localStorage.getItem('amberola-theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.dataset.theme = t;
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', t === 'dark' ? '#1c120d' : '#3c2415');
          }
        } catch (e) {
          /* Storage may be blocked; the system preference still applies. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
